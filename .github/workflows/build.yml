# Builds the Mac and Windows installers and attaches them to a GitHub Release.
# Runs on every push to main (and by hand from the Actions tab).
# The release is named after the version in package.json, so bump it to publish a new one.
name: Build installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm test
      - name: Signing (only when the secrets are set up)
        shell: bash
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$P12" ]; then
            { echo "CSC_LINK=$P12"; echo "CSC_KEY_PASSWORD=$P12_PASS"; echo "APPLE_ID=$APPLE_ID"; echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_PASS"; echo "APPLE_TEAM_ID=$APPLE_TEAM"; } >> "$GITHUB_ENV"
            echo "SIGN_ARGS=" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            # no certificate: ad-hoc sign so Apple Silicon Macs can still open it
            echo "SIGN_ARGS=-c.mac.identity=-" >> "$GITHUB_ENV"
          fi
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --publish never $SIGN_ARGS 2>&1 | tee build.log
      - name: Show the build error
        if: failure()
        shell: bash
        run: |
          echo "::error title=build::$(tail -c 2500 build.log | tr '\n' ' ' | sed 's/%/%25/g')"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Agent Buddy ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
