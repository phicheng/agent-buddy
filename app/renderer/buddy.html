<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
<title>Agent Buddy</title>
<style>
/* Layout: a mock desktop with floating 3D critters on the left; a dress-up rail on the right (stacks under on phones). */
:root{
  --bg:#E9ECF6; --panel:#FFFFFF; --panel-2:#F2F4FA; --ink:#1D2040; --muted:#686D91; --line:#DADFEE;
  --accent:#FF5E9A; --accent-ink:#FFFFFF; --blue:#4F7DFF;
  --f-display:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --desk-a:#FFB8D2; --desk-b:#A9C4FF; --desk-c1:#C9D6FF; --desk-c2:#E9D9FF; --desk-c3:#FFE1EC;
  --mb-bg:rgba(255,255,255,.55); --mb-fg:#2A2D4A; --w2-bg:#FBFBFE; --w2-tb:#EEF0F7; --w2-tbfg:#6B7090; --w2-line:#E3E6F2; --w2-h:#C9CFEA;
  --pet-filter:saturate(.62) contrast(.9) brightness(1.03);
  --bub-bg:rgba(255,255,255,.72); --bub-fg:#3A3E58; --bub-name:#4B5070; --bub-shadow:rgba(30,30,80,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12142A; --panel:#1B1E38; --panel-2:#252948; --ink:#ECEEFF; --muted:#9CA1C9; --line:#30355A;
  --accent:#FF7EAE; --accent-ink:#1B0C14; --blue:#7C9CFF;
  --desk-a:#3A2A4E; --desk-b:#22325A; --desk-c1:#141829; --desk-c2:#1B1D33; --desk-c3:#231C2E;
  --mb-bg:rgba(20,22,36,.6); --mb-fg:#B9BDD6; --w2-bg:#20243A; --w2-tb:#2A2F4A; --w2-tbfg:#8E93B5; --w2-line:#30354F; --w2-h:#3D4466;
  --pet-filter:saturate(.45) contrast(.8) brightness(.58);
  --bub-bg:rgba(30,33,50,.72); --bub-fg:#B4B8D2; --bub-name:#D2D5EA; --bub-shadow:rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12142A; --panel:#1B1E38; --panel-2:#252948; --ink:#ECEEFF; --muted:#9CA1C9; --line:#30355A;
  --accent:#FF7EAE; --accent-ink:#1B0C14; --blue:#7C9CFF;
  --desk-a:#3A2A4E; --desk-b:#22325A; --desk-c1:#141829; --desk-c2:#1B1D33; --desk-c3:#231C2E;
  --mb-bg:rgba(20,22,36,.6); --mb-fg:#B9BDD6; --w2-bg:#20243A; --w2-tb:#2A2F4A; --w2-tbfg:#8E93B5; --w2-line:#30354F; --w2-h:#3D4466;
  --pet-filter:saturate(.45) contrast(.8) brightness(.58);
  --bub-bg:rgba(30,33,50,.72); --bub-fg:#B4B8D2; --bub-name:#D2D5EA; --bub-shadow:rgba(0,0,0,.25); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font-family:inherit}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- stage / mock desktop ---- */
.stage{position:relative;border-radius:20px;overflow:hidden;min-height:0;isolation:isolate}
.desk{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 85% 100%,var(--desk-a) 0%,transparent 55%),
  radial-gradient(90% 80% at 0% 0%,var(--desk-b) 0%,transparent 60%),
  linear-gradient(160deg,var(--desk-c1),var(--desk-c2) 55%,var(--desk-c3));z-index:0}
.menubar{position:absolute;top:0;left:0;right:0;height:26px;background:var(--mb-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:16px;padding:0 12px;font-size:12px;color:var(--mb-fg)}
.menubar b{font-weight:700}.menubar .sp{flex:1}
.win{position:absolute;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(40,40,90,.22)}
.win .tb{height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11px}
.win .tb i{width:10px;height:10px;border-radius:50%;display:block}
.w1{left:5%;top:11%;width:52%;height:58%;background:#1E2233}
.w1 .tb{background:#272B40;color:#9AA0C4}
.code{padding:12px 14px;display:grid;gap:7px}
.code span{display:block;height:8px;border-radius:4px}
.w2{left:40%;top:24%;width:42%;height:46%;background:var(--w2-bg)}
.w2 .tb{background:var(--w2-tb);color:var(--w2-tbfg)}
.page{padding:14px;display:grid;gap:9px}
.page span{display:block;height:9px;border-radius:5px;background:var(--w2-line)}
.page .h{height:16px;width:60%;background:var(--w2-h)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:2}
/* on the desktop the critters are a side character: muted, soft, quiet */
.stage:not(.room) #c{filter:var(--pet-filter)}
.stage:not(.room) .bubbles{filter:saturate(.55)}
.bubbles{position:absolute;inset:0;pointer-events:none;z-index:3}
.bub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--bub-bg);color:var(--bub-fg);border-radius:10px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:3px 8px 4px;font-size:11px;white-space:nowrap;box-shadow:0 2px 8px var(--bub-shadow);transition:opacity .3s;display:flex;align-items:center;gap:5px;max-width:190px}
.bub::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--bub-bg);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bub.quiet .t{display:none}
.stage.room .bub{background:#FFFFFF;color:#3A3E58;font-size:12px;padding:5px 10px 6px}.stage.room .bub::after{background:#FFFFFF}.stage.room .bub b{color:#2A2D4A}.stage.room .bub .t{color:#4B5075}
.bub b{font:600 11px var(--f-display);color:var(--bub-name)}
.bub .d{width:7px;height:7px;border-radius:50%;flex:none}
.bub .t{overflow:hidden;text-overflow:ellipsis;color:var(--bub-fg)}
.bub.sel{outline:1.5px solid rgba(120,110,160,.45)}
.seg{position:absolute;top:36px;right:12px;z-index:4;display:flex;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;color:#2A2D4A;font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#2A2D4A;color:#fff}
.roomtag{position:absolute;top:36px;left:12px;z-index:4;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:12px;padding:6px 12px;color:#2A2D4A;font-size:12px}
.roomtag b{font:600 15px var(--f-display);display:block}
.hint{position:absolute;left:12px;bottom:10px;z-index:4;font-size:12px;color:#fff;background:rgba(20,22,50,.4);padding:4px 10px;border-radius:99px;pointer-events:none}
.stage.room .desk,.stage.room .menubar,.stage.room .win{visibility:hidden}
.hwbtn{position:absolute;top:74px;right:12px;z-index:4;border:0;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:500;cursor:pointer;
  background:rgba(255,255,255,.75);color:#2A2D4A;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stage.hw .hwbtn{background:#FF8A1F;color:#2A1300}


/* ---- rail ---- */
.rail{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.card{background:var(--panel);border-radius:18px;padding:14px;display:grid;gap:10px}
.card h2{margin:0;font:600 12px var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lbl{font-size:12px;color:var(--muted);margin-bottom:-4px}
.agents{display:grid;gap:6px}
.ag{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:2px solid transparent;
  background:var(--panel-2);color:var(--ink);border-radius:12px;padding:7px 10px;cursor:pointer}
.ag[aria-pressed="true"]{border-color:var(--accent)}
.agrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.agrow.off .ag{opacity:.5}
.tog{width:42px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"]::after{left:21px}
.ag .av{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.ag b{font:600 14px var(--f-display);display:block}
.ag small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add{border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:8px;cursor:pointer;font-size:13px}
.add:hover{color:var(--ink);border-color:var(--muted)}
.add:disabled{opacity:.5;cursor:default}
#nm{font:600 18px var(--f-display);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;width:100%}
#nm:focus{outline:2px solid var(--accent);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--panel));font-weight:500}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rm{border:2px solid transparent;background:var(--panel-2);color:var(--ink);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;text-align:left;display:grid}
.rm i{height:30px;display:block}
.rm span{padding:5px 8px 6px;font-size:12px;line-height:1.3}
.rm small{display:block;color:var(--muted);font-size:11px}
.rm[aria-pressed="true"]{border-color:var(--accent)}
.del{justify-self:start;border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 0;text-decoration:underline}
.bub .lv{display:none;font:600 9.5px var(--f-body);background:rgba(200,110,120,.85);color:#fff;border-radius:6px;padding:0 5px}
.bub.live .lv{display:none}
.livest{font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--panel-2);color:var(--muted)}
.livest.on{color:var(--ink)}
.livest.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#22B07D;margin-right:6px;vertical-align:1px}
.src{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:12.5px;color:var(--muted)}
.src b{display:block;color:var(--ink);font:600 13px var(--f-display)}
details summary{cursor:pointer;font-weight:500}
details p{margin:8px 0;color:var(--muted);font-size:12.5px}
textarea{width:100%;min-height:58px;font:12px var(--f-mono);border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel-2);color:var(--ink);resize:vertical}
.btn{border:0;border-radius:10px;padding:7px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:13px}
.err{color:#E5484D;font-size:12px;min-height:1em;margin:4px 0 0}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (max-width:820px){
  .app{height:auto;grid-template-columns:1fr}
  .stage{height:64vh;min-height:440px}
  .rail{overflow:visible}
  .w2{left:30%;width:62%}
}

/* ---- desktop app modes ---- */
html,body{overflow:hidden}
body.overlay,html:has(body.overlay){background:transparent!important}
body.overlay .app{display:block;height:100%;padding:0}
body.overlay .stage{position:fixed;inset:0;border-radius:0;background:transparent}
body.overlay .desk,body.overlay .menubar,body.overlay .win,body.overlay .seg,body.overlay .hint,body.overlay .hwbtn,body.overlay .roomtag,body.overlay .rail,body.overlay .preview{display:none!important}
.preview{position:absolute;left:12px;top:36px;z-index:4;font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--mb-bg);color:var(--mb-fg)}
.stage.room .preview{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn2{border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;background:var(--panel-2);color:var(--ink);font-weight:500;font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.connect-card{outline:2px solid var(--accent);outline-offset:-2px}
.connect-card.ok{outline:none}
</style>

</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <div class="desk"></div>
    <div class="menubar"><b>Finder</b><span>檔案</span><span>編輯</span><span>視窗</span><span class="sp"></span><span id="clock">16:00</span></div>
    <div class="win w1"><div class="tb"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i>&nbsp; auth.ts — 編輯器</div>
      <div class="code" id="code"></div></div>
    <div class="win w2"><div class="tb"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i>&nbsp; 研究筆記</div>
      <div class="page"><span class="h"></span><span></span><span style="width:92%"></span><span style="width:80%"></span><span></span><span style="width:70%"></span></div></div>
    <div class="preview">預覽：實際會浮在你的桌面上</div>
    <canvas id="c" aria-label="Agent 小夥伴"></canvas>
    <div class="bubbles" id="bubbles"></div>
    <div class="roomtag" id="roomtag" hidden><b id="rtName">程式工作室</b><span id="rtSub">住了 1 隻</span></div>
    <div class="seg" role="group" aria-label="檢視">
      <button id="vDesk" aria-pressed="true">浮在桌面</button>
      <button id="vRoom" aria-pressed="false">回牠的家</button>
    </div>
    <button class="hwbtn" id="hw" aria-pressed="true">萬聖節裝扮：開</button>
    <div class="hint" id="hint">拖曳可以移動牠 · 點一下選牠來打扮</div>
  </section>

  <aside class="rail">
    <div class="card connect-card" id="connCard">
      <h2>連接 Claude</h2>
      <div class="livest" id="liveSt">檢查中…</div>
      <p class="note" id="connNote"></p>
      <div class="row"><button class="btn" id="connBtn">連接 Claude Code</button><button class="btn2" id="testBtn">測試一下</button></div>
      <p class="err" id="connErr"></p>
      <div class="lbl" style="margin:0">支援終端機裡的 Claude Code、Claude 桌面 App 的 Code 分頁、VS Code 與 JetBrains 外掛。一般的網頁聊天看不到。</div>
    </div>
    <div class="card">
      <h2>我的 Agents</h2>
      <div class="lbl" style="margin:0" id="onCount"></div>
      <div class="agents" id="agents"></div>
      <button class="add" id="add">＋ 新增一隻</button>
    </div>
    <div class="card">
      <h2>打扮</h2>
      <input id="nm" maxlength="14" aria-label="名字">
      <div class="lbl">角色</div><div class="chips" id="species"></div>
      <div class="lbl" id="accLbl">配件</div><div class="chips" id="accs"></div>
      <div class="lbl">顏色</div><div class="sws" id="sws"></div>
      <button class="del" id="del">刪除這隻（不只是隱藏）</button>
    </div>
    <div class="card">
      <h2>住哪裡</h2>
      <div class="rooms" id="rooms"></div>
      <div class="lbl" style="margin:0">同一個空間可以住好幾隻。按「回牠的家」看看。</div>
    </div>
    <div class="card">
      <h2>小夥伴</h2>
      <div class="setrow"><span>浮在桌面上</span><button class="tog" id="tgOverlay" role="switch" aria-checked="true" aria-label="浮在桌面上"></button></div>
      <div class="setrow"><span>開機時自動開啟</span><button class="tog" id="tgAuto" role="switch" aria-checked="false" aria-label="開機時自動開啟"></button></div>
      <div class="lbl" style="margin:0">隨時可以從選單列（Mac）或右下角工作列（Windows）的小圖示叫出這個視窗。</div>
    </div>
  </aside>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* fake code lines */
(()=>{const cs=['#7AA2F7','#BB9AF7','#9ECE6A','#E0AF68','#565F89'];let h='';for(let i=0;i<14;i++){const ind=[0,0,16,16,32,16,0][i%7];
  h+=`<span style="margin-left:${ind}px;width:${30+((i*37)%55)}%;background:${cs[i%5]};opacity:.75"></span>`}$('code').innerHTML=h})();
setInterval(()=>{const d=new Date();$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')},1000);

/* ---------- data ---------- */
const STATES={idle:{zh:'發呆中',c:'#9AA0C4'},thinking:{zh:'思考',c:'#A77BFF'},searching:{zh:'搜尋',c:'#3BA7FF'},coding:{zh:'寫東西',c:'#22B07D'},
  tool:{zh:'用工具',c:'#F2A114'},sleeping:{zh:'睡覺',c:'#6E7BB8'},error:{zh:'卡住了',c:'#EF4E5E'},done:{zh:'完成',c:'#FF5E9A'}};
const SPECIES={ghost:'小幽靈',husky:'哈士奇',boy:'男生',girl:'女生',robot:'機器人'};
const ACCS={none:'不戴',cap:'毛帽',glasses:'眼鏡',headphones:'耳機',bow:'蝴蝶結',crown:'皇冠',sprout:'小芽',witch:'巫師帽',pumpkin:'南瓜帽',horns:'小惡魔角',batwings:'蝙蝠翅膀'};
let hw=store.get('buddy.hw',new Date().getMonth()===9);
const COSTUME={a1:'witch',now:'horns',r1:'witch',r2:'batwings',r3:'pumpkin',r4:'horns'};
const effAcc=c=>hw?(c.hacc||COSTUME[c.id]||'witch'):c.acc;
const COLORS=['#A9B3C2','#B5D3C7','#E3C3CA','#E2D3AE','#B9C8DD','#C8BFD8','#DDC3B2','#ECE9E3'];
const SOFTEN={'#9AA6BC':'#A9B3C2','#7FE0C2':'#B5D3C7','#FF9EC4':'#E3C3CA','#FFD86B':'#E2D3AE','#8EC5FF':'#B9C8DD','#C6A8FF':'#C8BFD8','#FFB28A':'#DDC3B2','#F4F4FA':'#ECE9E3'};
const ROOMS={
  cowork:{zh:'Coworking',role:'共享辦公空間',sky:['#D6E2F0','#F6F8FC'],ground:'#B7C0CD',sw:'linear-gradient(90deg,#D6E2F0,#B7C0CD)',
    script:[['thinking','讀需求',4],['searching','找相關檔案',3.5],['coding','動手改',5],['tool','跑測試',4],['error','有東西沒過',3],['coding','修好它',4],['done','完成',3],['idle','喝杯咖啡',5]]},
  living:{zh:'家裡客廳',role:'放鬆待命',sky:['#FFDCC0','#FFF6EC'],ground:'#D4AE86',sw:'linear-gradient(90deg,#FFDCC0,#D4AE86)',

  else A=agents.find(a=>a.c.key===m.key);
  if(!A){if(MODE!=='overlay'||DISPLAY!==PRIMARY)return; /* the overlay owns creating critters; settings reloads when the list changes */
    const free=agents.find(a=>!a.c.key&&a.c.id==='a1');
    if(free){free.c.key=m.key;free.c.task='Claude Code · '+m.label;A=free}
    else{if(agents.length>=8)return;const n=agents.length;
      const c={id:'k'+Date.now().toString(36),key:m.key,name:String(m.label||'Claude').slice(0,14),task:'Claude Code · '+m.label,species:SP_ORDER[n%SP_ORDER.length],acc:'none',
        color:COLORS[(n*3)%COLORS.length],room:Object.keys(ROOMS)[n%Object.keys(ROOMS).length],fx:Math.max(.1,.86-n*.12),fy:.9,on:true};
      cfgs.push(c);A=makeAgent(c);sparkles(A)}
    save()}
  A.live=true;A.lastAt=Date.now();setState(A,m.state,String(m.text||'').slice(0,40))}
if(window.buddy){window.buddy.onEvent(onLive);window.buddy.onSelect(id=>{const A=agents.find(a=>a.c.id===id);if(A)select(A)})}
window.addEventListener('storage',e=>{if(!e.key||!e.key.startsWith('buddy.'))return;
  if(MODE==='overlay'){location.reload();return}
  if(e.key==='buddy.agents'){let list=[];try{list=JSON.parse(e.newValue||'[]')||[]}catch(x){}
    if(list.map(c=>c.id).join()!==agents.map(a=>a.c.id).join()){location.reload();return}
    /* same critters: pick up which project each one now belongs to, without reloading */
    list.forEach(o=>{const A=agents.find(a=>a.c.id===o.id);if(A&&o.key&&A.c.key!==o.key){A.c.key=o.key;A.c.task=o.task}});paintList()}});

/* ---------- settings: Claude connection + app switches ---------- */
function ago(ts){if(!ts)return '';const m=Math.round((Date.now()-ts)/60000);return m<1?'剛剛':m<60?m+' 分鐘前':Math.round(m/60)+' 小時前'}
function paintStatus(st){if(!st||MODE!=='settings')return;const el=$('liveSt'),note=$('connNote'),btn=$('connBtn'),err=$('connErr'),card=$('connCard');
  err.textContent=st.serverError==='PORT_IN_USE'?'有另一個 Agent Buddy 正在執行，或別的程式佔用了通訊埠 47321。請先結束它再重新打開。':'';
  if(st.connected){el.textContent='已連接 Claude Code';el.className='livest on';card.classList.add('ok');btn.textContent='解除連接';
    note.textContent=st.lastEventAt?`最後一次收到 Claude 的動態：${ago(st.lastEventAt)}`:'新開一個 Claude Code 對話，叫它做點事，小夥伴就會動起來。（已經開著的對話要重新開始一次）'}
  else{el.textContent=st.readable===false?'Claude 的設定檔讀不懂，先不動它':'還沒連接';el.className='livest';card.classList.remove('ok');btn.textContent='連接 Claude Code';
    note.textContent='按一下就好。會在 Claude Code 的設定裡加上幾行「做事時通知小夥伴」，原本的設定都不會動，也會先自動備份。資料只在你的電腦裡傳，不會上網。'}
  $('tgOverlay').setAttribute('aria-checked',!!st.overlayVisible);$('tgAuto').setAttribute('aria-checked',!!st.autostart)}
if(MODE==='settings'&&window.buddy){
  window.buddy.status().then(paintStatus);window.buddy.onStatus(paintStatus);setInterval(()=>window.buddy.status().then(paintStatus),15000);
  $('connBtn').onclick=async()=>{const st=await window.buddy.status();const r=st.connected?await window.buddy.disconnect():await window.buddy.connect();
    if(r&&!r.ok){$('connErr').textContent=r.error==='SETTINGS_UNREADABLE'?`Claude 的設定檔（${r.file}）格式有問題，為了安全我們沒有修改它。請檢查或刪掉這個檔案後再試一次。`:'寫入 Claude 的設定檔失敗，請確認檔案沒有被鎖住後再試一次。'}
    else if(r&&r.ok&&!st.connected){const A=sel();A.pat=1;hearts(A)}
    paintStatus(await window.buddy.status())};
  $('testBtn').onclick=()=>window.buddy.test();
  $('tgOverlay').onclick=async()=>paintStatus(await window.buddy.toggleOverlay());
  $('tgAuto').onclick=async()=>{const on=$('tgAuto').getAttribute('aria-checked')!=='true';paintStatus(await window.buddy.setAutostart(on))};
}else if(MODE==='settings'){$('liveSt').textContent='在瀏覽器裡預覽中：要用桌面 App 才能連接 Claude。'}
{const want=new URLSearchParams(location.search).get('select');if(want){const A=agents.find(a=>a.c.id===want);if(A)selId=want}}
/* ---------- pointer: drag on desktop, click to select ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0),hitP=new THREE.Vector3();
let down=null,drag=null,hoverA=null,interactive=false,lastClick={A:null,t:0};
function pick(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(ndc,camera);
  const vis=agents.filter(A=>A.v.root.visible);let best=null,bd=1e9;vis.forEach(A=>{const h=ray.intersectObject(A.v.root,true);if(h.length&&h[0].distance<bd){bd=h[0].distance;best=A}});return best}
canvas.addEventListener('pointerdown',e=>{const A=pick(e);down={x:e.clientX,y:e.clientY,A};if(view==='desk'&&A){drag=A;canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));
  if(drag&&down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>4){ray.setFromCamera(mouse,camera);ray.ray.intersectPlane(plane,hitP);
    const off=.95*deskScale();drag.c.fx=Math.min(.95,Math.max(.05,hitP.x/(2*halfW)+.5));drag.c.fy=Math.min(.97,Math.max(.25,.5-(hitP.y-off)/(2*halfH)));drag.dragging=true}
  hoverA=drag||pick(e);canvas.style.cursor=view==='desk'?(drag?'grabbing':(hoverA?'grab':'default')):'grab';
  if(MODE==='overlay'&&window.buddy){const want=!!hoverA;if(want!==interactive){interactive=want;window.buddy.setInteractive(want)}}});
canvas.addEventListener('pointerleave',()=>{hoverA=null;if(MODE==='overlay'&&interactive&&!drag&&window.buddy){interactive=false;window.buddy.setInteractive(false)}});
canvas.addEventListener('pointerup',e=>{if(down&&down.A&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<5){const A=down.A;
    if(MODE==='overlay'){A.pat=1;hearts(A);const now=Date.now();if(lastClick.A===A&&now-lastClick.t<400&&window.buddy)window.buddy.openSettings(A.c.id);lastClick={A,t:now}}
    else{select(A);A.pat=1;hearts(A)}}
  if(drag){const D=drag;D.dragging=false;
    const outside=e.clientX<0||e.clientY<0||e.clientX>innerWidth||e.clientY>innerHeight;
    if(MODE==='overlay'&&outside&&window.buddy){window.buddy.locate(e.screenX,e.screenY).then(r=>{
        if(r&&r.display!==DISPLAY){D.c.display=r.display;D.c.fx=Math.min(.95,Math.max(.05,r.fx));D.c.fy=Math.min(.97,Math.max(.25,r.fy+.08))}
        else if(r){D.c.display=DISPLAY}
        save()}).catch(()=>save());
      if(interactive){interactive=false;window.buddy.setInteractive(false)}}
    else{if(MODE==='overlay')D.c.display=DISPLAY;save()}}
  drag=null;down=null});

/* ---------- loop ---------- */
const clock=new THREE.Clock();const red=new THREE.Color('#FF6B6B'),tc=new THREE.Color();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  const roomList=view==='room'?agents.filter(A=>A.c.room===sel().c.room&&A.c.on!==false):[];
  agents.forEach(A=>{
    const v=A.v,c=A.c;A.st+=dt;
    if(A.state!=='sleeping'&&Date.now()-A.lastAt>IDLE_SLEEP){A.live=false;setState(A,'sleeping','休息中')}
    /* states only change when Claude reports */
    // placement
    let base=new THREE.Vector3(),scale=1,vis=c.on!==false&&belongsHere(c),ry=0;
    if(view==='desk'){scale=deskScale();base.set((c.fx-.5)*2*halfW,(.5-c.fy)*2*halfH,0);base.y+=Math.sin(t*1.6+A.ph)*.08;}
    else{const i=roomList.indexOf(A);vis=i>=0;const n=roomList.length;base.set((i-(n-1)/2)*2.4,v.ghost?.25+Math.sin(t*1.6+A.ph)*.08:0,i%2?-.6:0)}
    v.root.visible=vis;A.bub.style.display=vis?'':'none';if(!vis)return;
    v.root.position.copy(base);v.root.scale.setScalar(scale);
    // pose
    const s=A.state,sleep=s==='sleeping',busy=['thinking','searching','coding','tool'].includes(s);
    A.pat=Math.max(0,A.pat-dt*2.2);const sq=Math.sin(A.pat*Math.PI)*.18,br=sleep?Math.sin(t*1.2+A.ph)*.035:Math.sin(t*2.4+A.ph)*.02;
    v.body.scale.set(v.bodyBase.x+sq,v.bodyBase.y+br-sq,v.bodyBase.z+sq*.5);
    let y=0,rz=0,px=0;A.blink-=dt;let eY=1;if(A.blink<0){eY=Math.max(.1,Math.abs(A.blink+.07)/.07);if(A.blink<-.14)A.blink=2+Math.random()*3}
    let lx=mouse.x*.05,ly=mouse.y*.03;if(sleep)eY=.1;
    v.mouthO.visible=s==='error'||s==='done'||A.pat>.2;v.mouth.visible=!v.mouthO.visible;
    v.thought.visible=s==='thinking';v.mag.visible=s==='searching';v.laptop.visible=s==='coding';v.gear.visible=s==='tool';v.sweat.visible=s==='error';
    v.orbMat.color.set(STATES[s].c);const ob=busy?.85+Math.sin(t*9)*.25:1;v.orb.scale.setScalar(ob);v.orb.position.y=2.05+v.top+Math.sin(t*2+A.ph)*.05;
    v.arms.forEach((a,i)=>{a.position.y=.8+Math.sin(t*2+i)*.03;a.rotation.z=0});
    switch(s){
      case 'idle':rz=Math.sin(t*1.1+A.ph)*.06;ry=Math.sin(t*.4+A.ph)*.25;break;
      case 'thinking':rz=.12+Math.sin(t*1.5)*.03;lx=.06;ly=.06;v.dots.forEach((d,i)=>d.position.y=.5+Math.max(0,Math.sin(t*5-i*.8))*.06);break;
      case 'searching':ry=Math.sin(t*1.4)*.5;{const a=t*1.6;v.mag.position.set(Math.cos(a)*1.5,1.3+Math.sin(t*3)*.15,Math.sin(a)*.8+.6);v.mag.rotation.set(0,-a,Math.sin(t*2)*.3)}lx=Math.cos(t*1.6)*.06;break;
      case 'coding':ly=-.05;v.arms.forEach((a,i)=>a.position.y=.66+Math.abs(Math.sin(t*16+i*Math.PI/2))*.12);
        A.spawn-=dt;if(A.spawn<0){A.spawn=view==='desk'?1.4:.45;emit(textSprite(['{}','</>','01','fn','=>'][Math.floor(Math.random()*5)],'#1F9D6B',.38*scale,'bold 64px "JetBrains Mono",monospace'),wpos(A,(Math.random()-.5)*.7,.8,1.3),new THREE.Vector3((Math.random()-.5)*.3*scale,.9*scale,0),1.4)}break;
      case 'tool':v.gear.rotation.z=-t*3;y=Math.abs(Math.sin(t*5))*.12;v.arms[1].position.y=1.05;v.arms[1].rotation.z=.5;break;
      case 'sleeping':rz=.18;A.spawn-=dt;if(A.spawn<0){A.spawn=1.2;emit(textSprite('Z','#6E7BB8',(.35+Math.random()*.2)*scale),wpos(A,.6,2.3,.2),new THREE.Vector3(.25*scale,.5*scale,0),2)}break;
      case 'error':if(A.st<1)px=Math.sin(t*45)*.05*(1-A.st);rz=-.05;v.sweat.position.y=1.72+v.top-((A.st*.6)%.4);break;
      case 'done':{const k=Math.max(0,1-A.st/1.4);y=Math.abs(Math.sin(A.st*7))*(view==='desk'?.3:.6)*k;rz=Math.sin(A.st*7)*.08*k;v.arms.forEach(a=>a.position.y=1.08)}break;
    }
    if(A.dragging){rz=Math.sin(t*10)*.12;y+=.15}
    tc.set(c.color);if(s==='error'&&A.st<1.2)tc.lerp(red,.45*(1-A.st/1.2));v.bodyMat.color.copy(tc);
    v.pet.position.set(px,y,0);v.pet.rotation.set(0,ry,rz);
    v.eyes.forEach(e=>{e.scale.y=eY;e.position.x=e.userData.sx*.33+lx;e.position.y=.08+ly});
    if(v.wings){const f=.45+Math.sin(t*(busy?14:5)+A.ph)*.4;v.wings[0].rotation.y=-f;v.wings[1].rotation.y=f}
    if(v.ant)v.ant.rotation.z=Math.sin(t*3+A.ph)*.12+(busy?Math.sin(t*12)*.05:0);
  });
  if(view==='room'){envAnims.forEach(f=>f(t));tickParts(dt,t);controls.update()}
  tickFx(dt);renderer.render(scene,camera);
  // bubbles
  const w=stageEl.clientWidth,h=stageEl.clientHeight;
  agents.forEach(A=>{if(!A.v.root.visible)return;const p=wpos(A,0,2.55+A.v.top,0).project(camera);
    A.bub.style.left=((p.x+1)/2*w)+'px';A.bub.style.top=((1-p.y)/2*h)+'px';A.bub.style.opacity=p.z<1?(view==='desk'?.9:1):0;
    A.bub.classList.toggle('sel',A.c.id===selId);A.bub.classList.toggle('quiet',view==='desk'&&A!==hoverA&&A.c.id!==selId&&!['thinking','searching','coding','tool','error'].includes(A.state));A.bub.classList.toggle('live',!!A.live);
    A.bub.children[0].style.background=STATES[A.state].c;A.bub.children[1].textContent=A.c.name;A.bub.children[2].textContent=A.text||STATES[A.state].zh});
  requestAnimationFrame(frame);
}
resize();$('hw').onclick=()=>setHw(!hw);setHw(hw);setView('desk');paintList();paintEditor();requestAnimationFrame(frame);
window.__buddy={MODE,agents,setView}; /* for the smoke test */
})();
